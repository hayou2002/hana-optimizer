<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="hana-optimizer 优化大师 概览">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F3F6"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#64748B"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="620" rx="26" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" rx="3" fill="url(#bar)"/>

  <!-- 标题 -->
  <text x="64" y="94" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="44" font-weight="700" fill="#0F172A">hana-optimizer</text>
  <text x="66" y="130" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="22" font-weight="600" fill="#334155">优化大师 · 工作区治理</text>
  <text x="66" y="166" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="16" fill="#64748B">把「整理与清理」变成一套可重复执行的规矩 · 无引擎，Agent 现场执行</text>

  <!-- 三动作 -->
  <g font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
    <rect x="64" y="204" width="346" height="118" rx="16" fill="#FFFFFF" stroke="#E2E6EC"/>
    <text x="90" y="246" font-size="14" font-weight="700" fill="#94A3B8">01</text>
    <text x="90" y="278" font-size="22" font-weight="600" fill="#0F172A">初始化</text>
    <text x="90" y="304" font-size="13.5" fill="#64748B">建骨架 · 落规则 · 注入纪律</text>

    <rect x="427" y="204" width="346" height="118" rx="16" fill="#FFFFFF" stroke="#E2E6EC"/>
    <text x="453" y="246" font-size="14" font-weight="700" fill="#94A3B8">02</text>
    <text x="453" y="278" font-size="22" font-weight="600" fill="#0F172A">优化</text>
    <text x="453" y="304" font-size="13.5" fill="#64748B">体检 → 三档方案 → 清理整理</text>

    <rect x="790" y="204" width="346" height="118" rx="16" fill="#FFFFFF" stroke="#E2E6EC"/>
    <text x="816" y="246" font-size="14" font-weight="700" fill="#94A3B8">03</text>
    <text x="816" y="278" font-size="22" font-weight="600" fill="#0F172A">整理</text>
    <text x="816" y="304" font-size="13.5" fill="#64748B">文件归位 ＋ 记忆修剪</text>
  </g>

  <!-- 护栏流程 -->
  <text x="64" y="384" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="15" font-weight="600" fill="#0F172A">护栏流程</text>
  <g font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="15" fill="#334155">
    <rect x="64" y="400" width="156" height="46" rx="23" fill="#F1F3F6"/>
    <text x="142" y="429" text-anchor="middle">扫描</text>
    <text x="235" y="429" text-anchor="middle" fill="#B4BCC8">→</text>

    <rect x="250" y="400" width="156" height="46" rx="23" fill="#F1F3F6"/>
    <text x="328" y="429" text-anchor="middle">三档方案</text>
    <text x="421" y="429" text-anchor="middle" fill="#B4BCC8">→</text>

    <rect x="436" y="400" width="156" height="46" rx="23" fill="#E9EDF2" stroke="#334155" stroke-width="1.5"/>
    <text x="514" y="429" text-anchor="middle" fill="#334155" font-weight="600">人确认</text>
    <text x="607" y="429" text-anchor="middle" fill="#B4BCC8">→</text>

    <rect x="622" y="400" width="156" height="46" rx="23" fill="#F1F3F6"/>
    <text x="700" y="429" text-anchor="middle">执行</text>
    <text x="793" y="429" text-anchor="middle" fill="#B4BCC8">→</text>

    <rect x="808" y="400" width="156" height="46" rx="23" fill="#F1F3F6"/>
    <text x="886" y="429" text-anchor="middle">验证</text>
  </g>

  <!-- 四板块 -->
  <text x="64" y="502" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="15" font-weight="600" fill="#0F172A">四个板块</text>
  <g font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="15" fill="#334155">
    <rect x="64" y="518" width="256" height="50" rx="14" fill="#FFFFFF" stroke="#E2E6EC"/>
    <circle cx="92" cy="543" r="5" fill="#334155"/>
    <text x="110" y="548">工作区</text>

    <rect x="332" y="518" width="256" height="50" rx="14" fill="#FFFFFF" stroke="#E2E6EC"/>
    <circle cx="360" cy="543" r="5" fill="#475569"/>
    <text x="378" y="548">外部工作文件夹</text>

    <rect x="600" y="518" width="256" height="50" rx="14" fill="#FFFFFF" stroke="#E2E6EC"/>
    <circle cx="628" cy="543" r="5" fill="#64748B"/>
    <text x="646" y="548">Hana 本体</text>

    <rect x="868" y="518" width="256" height="50" rx="14" fill="#FFFFFF" stroke="#E2E6EC"/>
    <circle cx="896" cy="543" r="5" fill="#94A3B8"/>
    <text x="914" y="548">经验与记忆</text>
  </g>

  <!-- 脚注 -->
  <text x="64" y="600" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="13.5" fill="#8A93A0">删除先软删进反悔区 · 可回滚 · 只信实测 · 外部文件夹默认只读巡检</text>
</svg>